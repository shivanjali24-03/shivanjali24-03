<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05010f"/><stop offset="0.55" stop-color="#0b0726"/><stop offset="1" stop-color="#020b1a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.28"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#00f0ff" stop-opacity="0.4"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7c3aed" stroke-opacity="0.16"/></pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="460" rx="22"/></clipPath>
    <style>
      .fade{animation:in 1s ease-out both}
      @keyframes in{from{opacity:.25;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      .float{animation:float 6s ease-in-out infinite} .float2{animation:float 7s ease-in-out infinite reverse}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      .blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
      .spin{transform-origin:1030px 200px;animation:spin 18s linear infinite}
      .spinr{transform-origin:1030px 200px;animation:spin 12s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .chip{font-size:14px;fill:#ede9fe}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="url(#bg)"/>
    <rect width="1200" height="460" fill="url(#grid)"/>
    <circle cx="160" cy="60" r="230" fill="url(#orbA)" class="float"/>
    <circle cx="1080" cy="420" r="250" fill="url(#orbB)" class="float2"/>
    <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)"><animate attributeName="y" values="-60;460" dur="5s" repeatCount="indefinite"/></rect>
    <g fill="#00f0ff">
      <circle cx="90" cy="440" r="2" class="pulse"/><circle cx="430" cy="34" r="1.6" class="pulse" style="animation-delay:.6s"/>
      <circle cx="820" cy="430" r="2.2" class="pulse" style="animation-delay:1.1s"/><circle cx="780" cy="50" r="1.5" class="pulse" style="animation-delay:1.6s"/>
    </g>
    <g fill="#ff2bd6">
      <circle cx="600" cy="110" r="1.8" class="pulse" style="animation-delay:.9s"/><circle cx="890" cy="300" r="2" class="pulse" style="animation-delay:.4s"/>
      <circle cx="40" cy="250" r="1.6" class="pulse" style="animation-delay:1.4s"/>
    </g>

    <g transform="translate(70 0)">
      <text x="0" y="66" font-size="16" fill="#00f0ff" class="fade" style="animation-delay:.1s" letter-spacing="3">&lt;/&gt; 7+ YEARS · FROM SCRATCH TO PRODUCTION · TEAM LEAD</text>
      <text x="0" y="138" font-size="56" font-weight="800" fill="url(#title)" filter="url(#glow)" class="fade" style="animation-delay:.4s" letter-spacing="1">SENIOR REACT &amp;</text>
      <text x="0" y="202" font-size="56" font-weight="800" fill="#f5f3ff" class="fade" style="animation-delay:.8s" letter-spacing="1">FULL-STACK DEVELOPER<tspan fill="#ff2bd6" class="blink">_</tspan></text>
      <text x="0" y="244" font-size="16" fill="#c4b5fd" class="fade" style="animation-delay:1.2s">Product builder · Team leader · Cloud-ready apps · Clean architecture</text>
      <g class="fade" style="animation-delay:1.60s">
        <text x="0" y="303" font-size="12" font-weight="700" fill="#00e5ff" letter-spacing="2">REACT</text>
        <rect x="86" y="282" width="93" height="32" rx="16" fill="#00e5ff" fill-opacity="0.10" stroke="#00e5ff" stroke-opacity="0.55"/>
        <text x="132.5" y="303" text-anchor="middle" class="chip">React 19</text>
        <rect x="189" y="282" width="85" height="32" rx="16" fill="#00e5ff" fill-opacity="0.10" stroke="#00e5ff" stroke-opacity="0.55"/>
        <text x="231.5" y="303" text-anchor="middle" class="chip">Next.js</text>
        <rect x="284" y="282" width="110" height="32" rx="16" fill="#00e5ff" fill-opacity="0.10" stroke="#00e5ff" stroke-opacity="0.55"/>
        <text x="339.0" y="303" text-anchor="middle" class="chip">TypeScript</text>
        <rect x="404" y="282" width="135" height="32" rx="16" fill="#00e5ff" fill-opacity="0.10" stroke="#00e5ff" stroke-opacity="0.55"/>
        <text x="471.5" y="303" text-anchor="middle" class="chip">Redux Toolkit</text>
        <rect x="549" y="282" width="144" height="32" rx="16" fill="#00e5ff" fill-opacity="0.10" stroke="#00e5ff" stroke-opacity="0.55"/>
        <text x="621.0" y="303" text-anchor="middle" class="chip">TanStack Query</text>
        <rect x="703" y="282" width="93" height="32" rx="16" fill="#00e5ff" fill-opacity="0.10" stroke="#00e5ff" stroke-opacity="0.55"/>
        <text x="749.5" y="303" text-anchor="middle" class="chip">Tailwind</text>
      </g>
      <g class="fade" style="animation-delay:1.75s">
        <text x="0" y="341" font-size="12" font-weight="700" fill="#a855f7" letter-spacing="2">API</text>
        <rect x="86" y="320" width="85" height="32" rx="16" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.55"/>
        <text x="128.5" y="341" text-anchor="middle" class="chip">Node.js</text>
        <rect x="181" y="320" width="76" height="32" rx="16" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.55"/>
        <text x="219.0" y="341" text-anchor="middle" class="chip">NestJS</text>
        <rect x="267" y="320" width="85" height="32" rx="16" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.55"/>
        <text x="309.5" y="341" text-anchor="middle" class="chip">Express</text>
        <rect x="362" y="320" width="68" height="32" rx="16" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.55"/>
        <text x="396.0" y="341" text-anchor="middle" class="chip">Flask</text>
        <rect x="440" y="320" width="60" height="32" rx="16" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.55"/>
        <text x="470.0" y="341" text-anchor="middle" class="chip">REST</text>
        <rect x="510" y="320" width="85" height="32" rx="16" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.55"/>
        <text x="552.5" y="341" text-anchor="middle" class="chip">GraphQL</text>
      </g>
      <g class="fade" style="animation-delay:1.90s">
        <text x="0" y="379" font-size="12" font-weight="700" fill="#ff2bd6" letter-spacing="2">CLOUD</text>
        <rect x="86" y="358" width="169" height="32" rx="16" fill="#ff2bd6" fill-opacity="0.10" stroke="#ff2bd6" stroke-opacity="0.55"/>
        <text x="170.5" y="379" text-anchor="middle" class="chip">Azure App Service</text>
        <rect x="265" y="358" width="152" height="32" rx="16" fill="#ff2bd6" fill-opacity="0.10" stroke="#ff2bd6" stroke-opacity="0.55"/>
        <text x="341.0" y="379" text-anchor="middle" class="chip">Azure Functions</text>
        <rect x="427" y="358" width="51" height="32" rx="16" fill="#ff2bd6" fill-opacity="0.10" stroke="#ff2bd6" stroke-opacity="0.55"/>
        <text x="452.5" y="379" text-anchor="middle" class="chip">AWS</text>
        <rect x="488" y="358" width="76" height="32" rx="16" fill="#ff2bd6" fill-opacity="0.10" stroke="#ff2bd6" stroke-opacity="0.55"/>
        <text x="526.0" y="379" text-anchor="middle" class="chip">Docker</text>
        <rect x="574" y="358" width="68" height="32" rx="16" fill="#ff2bd6" fill-opacity="0.10" stroke="#ff2bd6" stroke-opacity="0.55"/>
        <text x="608.0" y="379" text-anchor="middle" class="chip">CI/CD</text>
      </g>
      <g class="fade" style="animation-delay:2.05s">
        <text x="0" y="417" font-size="12" font-weight="700" fill="#22c55e" letter-spacing="2">DATA</text>
        <rect x="86" y="396" width="110" height="32" rx="16" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-opacity="0.55"/>
        <text x="141.0" y="417" text-anchor="middle" class="chip">PostgreSQL</text>
        <rect x="206" y="396" width="110" height="32" rx="16" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-opacity="0.55"/>
        <text x="261.0" y="417" text-anchor="middle" class="chip">SQL Server</text>
        <rect x="326" y="396" width="85" height="32" rx="16" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-opacity="0.55"/>
        <text x="368.5" y="417" text-anchor="middle" class="chip">MongoDB</text>
        <rect x="421" y="396" width="68" height="32" rx="16" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-opacity="0.55"/>
        <text x="455.0" y="417" text-anchor="middle" class="chip">Redis</text>
      </g>
    </g>

    <circle cx="1030" cy="200" r="118" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-dasharray="4 10" class="spin"/>
    <circle cx="1030" cy="200" r="86" fill="none" stroke="#00f0ff" stroke-opacity="0.5" stroke-dasharray="60 24" class="spinr"/>
    <g class="spin"><circle cx="1148" cy="200" r="6" fill="#ff2bd6" filter="url(#glow)"/></g>
    <g class="spinr"><circle cx="1030" cy="114" r="5" fill="#00f0ff" filter="url(#glow)"/></g>
    <circle cx="1030" cy="200" r="48" fill="#0b0726" stroke="url(#title)" stroke-width="2.5" filter="url(#glow)"/>
    <text x="1030" y="196" text-anchor="middle" font-size="22" font-weight="800" fill="url(#title)">&lt;/&gt;</text>
    <text x="1030" y="218" text-anchor="middle" font-size="11" fill="#c4b5fd" letter-spacing="1">REACT</text>
    <rect x="1" y="1" width="1198" height="458" rx="21" fill="none" stroke="url(#title)" stroke-opacity="0.6" stroke-width="2"/>
  </g>
</svg>
