<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="0.55" stop-color="#0b0726"/>
      <stop offset="1" stop-color="#020b1a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#a855f7" stop-opacity="0.55"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#00f0ff" stop-opacity="0.45"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
    <style>
      .fade{opacity:0;animation:in 1.2s ease-out forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.2s}.d4{animation-delay:1.7s}
      @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .float{animation:float 6s ease-in-out infinite}
      .float2{animation:float 7s ease-in-out infinite reverse}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .spin{transform-origin:1010px 170px;animation:spin 18s linear infinite}
      .spinr{transform-origin:1010px 170px;animation:spin 12s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .chip{font-size:15px;fill:#c4b5fd}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <circle cx="180" cy="60" r="220" fill="url(#orbA)" class="float"/>
    <circle cx="1050" cy="300" r="240" fill="url(#orbB)" class="float2"/>

    <!-- scanning line -->
    <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
      <animate attributeName="y" values="-60;340" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- particles -->
    <g fill="#00f0ff">
      <circle cx="90" cy="290" r="2" class="pulse"/>
      <circle cx="420" cy="40" r="1.6" class="pulse" style="animation-delay:.6s"/>
      <circle cx="640" cy="305" r="2.2" class="pulse" style="animation-delay:1.1s"/>
      <circle cx="760" cy="60" r="1.5" class="pulse" style="animation-delay:1.6s"/>
      <circle cx="300" cy="200" r="1.4" class="pulse" style="animation-delay:.3s"/>
    </g>
    <g fill="#ff2bd6">
      <circle cx="560" cy="120" r="1.8" class="pulse" style="animation-delay:.9s"/>
      <circle cx="840" cy="250" r="2" class="pulse" style="animation-delay:.4s"/>
      <circle cx="40" cy="120" r="1.6" class="pulse" style="animation-delay:1.4s"/>
    </g>

    <!-- text block -->
    <g transform="translate(70 0)">
      <text x="0" y="92" font-size="18" fill="#00f0ff" class="fade d1" letter-spacing="4">&lt;/&gt; HELLO_WORLD.init()</text>
      <text x="0" y="168" font-size="62" font-weight="800" fill="url(#title)" filter="url(#glow)" class="fade d2" letter-spacing="2">FULL-STACK</text>
      <text x="0" y="232" font-size="62" font-weight="800" fill="#f5f3ff" class="fade d3" letter-spacing="2">DEVELOPER<tspan fill="#ff2bd6" class="blink">_</tspan></text>
      <g class="fade d4">
        <rect x="0" y="262" width="96" height="32" rx="16" fill="#7c3aed" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.6"/>
        <text x="48" y="283" text-anchor="middle" class="chip">React</text>
        <rect x="108" y="262" width="104" height="32" rx="16" fill="#7c3aed" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.6"/>
        <text x="160" y="283" text-anchor="middle" class="chip">Node.js</text>
        <rect x="224" y="262" width="104" height="32" rx="16" fill="#7c3aed" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.6"/>
        <text x="276" y="283" text-anchor="middle" class="chip">Python</text>
        <rect x="340" y="262" width="126" height="32" rx="16" fill="#7c3aed" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.6"/>
        <text x="403" y="283" text-anchor="middle" class="chip">Databases</text>
      </g>
    </g>

    <!-- orbital core -->
    <g transform="translate(0 0)">
      <circle cx="1010" cy="170" r="118" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-dasharray="4 10" class="spin"/>
      <circle cx="1010" cy="170" r="86" fill="none" stroke="#00f0ff" stroke-opacity="0.5" stroke-dasharray="60 24" class="spinr"/>
      <g class="spin"><circle cx="1128" cy="170" r="6" fill="#ff2bd6" filter="url(#glow)"/></g>
      <g class="spinr"><circle cx="1010" cy="84" r="5" fill="#00f0ff" filter="url(#glow)"/></g>
      <circle cx="1010" cy="170" r="46" fill="#0b0726" stroke="url(#title)" stroke-width="2.5" filter="url(#glow)"/>
      <text x="1010" y="181" text-anchor="middle" font-size="30" font-weight="800" fill="url(#title)">{ }</text>
    </g>

    <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="url(#title)" stroke-opacity="0.6" stroke-width="2"/>
  </g>
</svg>
