<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05010f"/><stop offset="1" stop-color="#0b0726"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7c3aed" stroke-opacity=".12"/></pattern>
    <style>
      .card{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
      @keyframes rise{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      .pulse{animation:pulse 2.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
    </style>
  </defs>
  <rect width="1200" height="400" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="22" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="140" height="400" fill="url(#edge)" opacity=".05"/>
  <text x="70" y="58" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#00e5ff" letter-spacing="3">&lt;/&gt; INDUSTRIES I BUILD FOR</text>
  
    <g class="card" style="animation-delay:0.00s">
      <rect x="70" y="92" width="340" height="130" rx="18" fill="#22c55e" fill-opacity=".06" stroke="#22c55e" stroke-opacity=".45"/>
      <rect x="70" y="92" width="5" height="130" rx="2.5" fill="#22c55e"/>
      <circle cx="122" cy="142" r="27" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".5"/>
      <path transform="translate(122 142)" d="M-14 -4h8v-8h12v8h8v12h-8v8h-12v-8h-8z" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="164" y="149" font-size="21" font-weight="800" fill="#f5f3ff">Healthcare</text>
      <rect x="318" y="110" width="74" height="24" rx="12" fill="#22c55e" fill-opacity=".18" stroke="#22c55e" class="pulse"/><text x="355" y="127" text-anchor="middle" font-size="12" font-weight="800" fill="#22c55e" letter-spacing="1">HIPAA</text>
      <text x="98" y="192" font-size="14" fill="#c4b5fd">Patient portals, clinic &amp;</text>
      <text x="98" y="211" font-size="14" fill="#c4b5fd">scheduling apps, secure PHI</text>
    </g>
    <g class="card" style="animation-delay:0.12s">
      <rect x="440" y="92" width="340" height="130" rx="18" fill="#00e5ff" fill-opacity=".06" stroke="#00e5ff" stroke-opacity=".45"/>
      <rect x="440" y="92" width="5" height="130" rx="2.5" fill="#00e5ff"/>
      <circle cx="492" cy="142" r="27" fill="#00e5ff" fill-opacity=".12" stroke="#00e5ff" stroke-opacity=".5"/>
      <path transform="translate(492 142)" d="M-14 10a14 9 0 0 1 28 0M0 -14a7 7 0 1 1 0 .1" fill="none" stroke="#00e5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="534" y="149" font-size="21" font-weight="800" fill="#f5f3ff">CRM</text>
      
      <text x="468" y="192" font-size="14" fill="#c4b5fd">Leads, contacts, sales</text>
      <text x="468" y="211" font-size="14" fill="#c4b5fd">pipelines &amp; dashboards</text>
    </g>
    <g class="card" style="animation-delay:0.24s">
      <rect x="810" y="92" width="340" height="130" rx="18" fill="#a855f7" fill-opacity=".06" stroke="#a855f7" stroke-opacity=".45"/>
      <rect x="810" y="92" width="5" height="130" rx="2.5" fill="#a855f7"/>
      <circle cx="862" cy="142" r="27" fill="#a855f7" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".5"/>
      <path transform="translate(862 142)" d="M-14 14v-14l9 -6v6l9 -6v6l10 -6v20z" fill="none" stroke="#a855f7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="904" y="149" font-size="21" font-weight="800" fill="#f5f3ff">ERP</text>
      
      <text x="838" y="192" font-size="14" fill="#c4b5fd">Inventory, orders, HR,</text>
      <text x="838" y="211" font-size="14" fill="#c4b5fd">finance &amp; multi-module apps</text>
    </g>
    <g class="card" style="animation-delay:0.36s">
      <rect x="70" y="248" width="340" height="130" rx="18" fill="#ff2bd6" fill-opacity=".06" stroke="#ff2bd6" stroke-opacity=".45"/>
      <rect x="70" y="248" width="5" height="130" rx="2.5" fill="#ff2bd6"/>
      <circle cx="122" cy="298" r="27" fill="#ff2bd6" fill-opacity=".12" stroke="#ff2bd6" stroke-opacity=".5"/>
      <path transform="translate(122 298)" d="M-11 -15h22v30l-5.5 -4l-5.5 4l-5.5 -4l-5.5 4zM-6 -7h12M-6 -1h12M-6 5h8" fill="none" stroke="#ff2bd6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="164" y="305" font-size="21" font-weight="800" fill="#f5f3ff">Billing &amp; Invoicing</text>
      
      <text x="98" y="348" font-size="14" fill="#c4b5fd">Invoices, subscriptions,</text>
      <text x="98" y="367" font-size="14" fill="#c4b5fd">payments, tax &amp; receipts</text>
    </g>
    <g class="card" style="animation-delay:0.48s">
      <rect x="440" y="248" width="340" height="130" rx="18" fill="#facc15" fill-opacity=".06" stroke="#facc15" stroke-opacity=".45"/>
      <rect x="440" y="248" width="5" height="130" rx="2.5" fill="#facc15"/>
      <circle cx="492" cy="298" r="27" fill="#facc15" fill-opacity=".12" stroke="#facc15" stroke-opacity=".5"/>
      <path transform="translate(492 298)" d="M-6 -10l-9 10l9 10M6 -10l9 10l-9 10M3 -14l-6 28" fill="none" stroke="#facc15" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="534" y="305" font-size="21" font-weight="800" fill="#f5f3ff">Custom Development</text>
      
      <text x="468" y="348" font-size="14" fill="#c4b5fd">Tailor-made software,</text>
      <text x="468" y="367" font-size="14" fill="#c4b5fd">built from scratch to spec</text>
    </g>
    <g class="card" style="animation-delay:0.60s">
      <rect x="810" y="248" width="340" height="130" rx="18" fill="#38bdf8" fill-opacity=".06" stroke="#38bdf8" stroke-opacity=".45"/>
      <rect x="810" y="248" width="5" height="130" rx="2.5" fill="#38bdf8"/>
      <circle cx="862" cy="298" r="27" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/>
      <path transform="translate(862 298)" d="M-15 -13h30v26h-30zM-15 -5h30M-7 -5v18" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="904" y="305" font-size="21" font-weight="800" fill="#f5f3ff">Admin Portals</text>
      
      <text x="838" y="348" font-size="14" fill="#c4b5fd">Role-based portals,</text>
      <text x="838" y="367" font-size="14" fill="#c4b5fd">reports &amp; analytics</text>
    </g>
  <rect x="1" y="1" width="1198" height="398" rx="21" fill="none" stroke="url(#edge)" stroke-opacity=".55" stroke-width="2"/>
</svg>
