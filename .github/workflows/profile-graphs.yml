name: Update profile graphs

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  contrib-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/activity_graph.py "${{ github.repository_owner }}" assets/activity.svg

      - name: Commit graphs
        run: |
          # neutral identity: not linked to any GitHub account, so it never shows
          # in "Built by"/contributors and never inflates the contribution graph
          git config user.name "profile-graphs"
          git config user.email "profile-graphs@noreply.invalid"
          git add -A profile-3d-contrib assets/activity.svg
          git diff --cached --quiet || (git commit -m "Update profile graphs" && git pull --rebase && git push)
